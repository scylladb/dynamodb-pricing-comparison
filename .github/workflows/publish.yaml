name: Publish the application to the Serverless Application Repository

on:
  release:
    types:
      - 'published'

jobs:
  build:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: sam build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: eu-central-1
          mask-aws-account-id: 'false'
      - run: sam package --output-template-file packaged.yaml --s3-bucket ${{ secrets.S3_BUCKET }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: packaged.yaml

  publish:
    needs:
      - build
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        region:
          - us-east-2
          - us-east-1
          - us-west-1
          - us-west-2
          # - af-south-1
          # - ap-east-1
          # - ap-south-2
          # - ap-southeast-3
          # - ap-southeast-4
          - ap-south-1
          # - ap-northeast-3
          - ap-northeast-2
          - ap-southeast-1
          - ap-southeast-2
          - ap-northeast-1
          - ca-central-1
          # - ca-west-1
          - eu-central-1
          - eu-west-1
          - eu-west-2
          # - eu-south-1
          - eu-west-3
          # - eu-south-2
          - eu-north-1
          # - eu-central-2
          # - il-central-1
          # - me-south-1
          # - me-central-1
          - sa-east-1
          # - us-gov-east-1
          # - us-gov-west-1
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ matrix.region }}
          mask-aws-account-id: 'false'
      - run: sam publish --semantic-version ${{ github.event.release.tag_name }} --template artifact/packaged.yaml --region ${{ matrix.region }}
        env:
          AWS_DEFAULT_REGION: ${{ matrix.region }}
